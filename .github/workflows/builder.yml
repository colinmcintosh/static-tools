# Publish a multi-arch builder image and attest it. This is the only
# publisher; deps/ and tool builds pull the digest, they do not build it.
# workflow_dispatch is the rebuild button. Push to main of these paths
# publishes the first snapshot once this workflow itself lands on main
# (GitHub will not dispatch a workflow that exists only on a branch).
name: Builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - builder/Dockerfile
      - deps/versions.mk
      - .github/workflows/builder.yml

permissions: {}

concurrency:
  group: builder
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/builder

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          alpine_version=$(sed -n 's/^ALPINE_VERSION := //p' deps/versions.mk)
          alpine_digest=$(sed -n 's/^ALPINE_DIGEST := //p' deps/versions.mk)
          docker buildx build \
            --platform "linux/${ARCH}" \
            --file builder/Dockerfile \
            --build-arg "ALPINE_VERSION=${alpine_version}" \
            --build-arg "ALPINE_DIGEST=${alpine_digest}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/meta.json \
            builder/
          digest=$(jq -r '.["containerimage.digest"]' /tmp/meta.json)
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch index
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          date_tag="builder-$(date -u +%Y%m%d)"
          refs=()
          for digest_file in *; do
            refs+=("${IMAGE}@sha256:${digest_file}")
          done
          create_log=$(mktemp)
          docker buildx imagetools create \
            -t "${IMAGE}:sha-${short_sha}" \
            -t "${IMAGE}:${date_tag}" \
            "${refs[@]}" 2>&1 | tee "${create_log}"
          # imagetools inspect can fail on a just-pushed GHCR index (exit 255).
          # The create log prints the index digest as it is pushed.
          digest=$(grep -oE 'pushing sha256:[0-9a-f]{64} to [^[:space:]]+:sha-' "${create_log}" \
            | grep -oE 'sha256:[0-9a-f]{64}' | tail -1)
          if [[ -z "${digest}" || "${digest}" != sha256:* ]]; then
            echo "failed to read index digest from imagetools create" >&2
            cat "${create_log}" >&2
            exit 1
          fi
          {
            echo "digest=${digest}"
            echo "short_sha=${short_sha}"
            echo "date_tag=${date_tag}"
          } >> "${GITHUB_OUTPUT}"
          echo "Index digest: ${digest}"
          echo "Tags: sha-${short_sha} ${date_tag}"

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "/users/${{ github.repository_owner }}/packages/container/static-tools%2Fbuilder" \
            -f visibility=public

      - name: Export apk lock
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 "${IMAGE}@${DIGEST}" \
            cat /etc/static-tools-builder-packages.txt > "${RUNNER_TEMP}/apk-lock.txt"
          wc -l "${RUNNER_TEMP}/apk-lock.txt"

      - name: Upload apk lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-lock
          path: ${{ runner.temp }}/apk-lock.txt
          if-no-files-found: error
          retention-days: 7

      - name: Attest builder image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          SHORT_SHA: ${{ steps.manifest.outputs.short_sha }}
          DATE_TAG: ${{ steps.manifest.outputs.date_tag }}
        run: |
          set -euo pipefail
          {
            echo "## Builder image"
            echo ""
            echo "Copy into \`deps/versions.mk\`:"
            echo ""
            echo '```'
            echo "BUILDER_IMAGE := ${IMAGE}"
            echo "BUILDER_DIGEST := ${DIGEST}"
            echo '```'
            echo ""
            echo "Tags: \`${IMAGE}:sha-${SHORT_SHA}\`, \`${IMAGE}:${DATE_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
