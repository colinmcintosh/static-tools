# Trusted builder for release binaries (SLSA Build L3).
#
# release.yml calls this workflow after it verifies the tag. Everything that
# produces release bits runs here: the shared prefix, every tool, and the
# checksum and SBOM manifests. The certificate identity users verify,
# attest.yml@refs/tags/<tag>, therefore names the workflow that built the
# binaries, not only the one that signed them.
#
# Jobs that run repository code (deps, build, manifests) have contents: read
# only. Jobs that can mint OIDC tokens (attest, attest-sbom) run no repository
# code: they download the release-manifests artifact and sign the digests
# listed in it, never the build outputs themselves.
name: Build and attest

on:
  workflow_call:

permissions: {}

# BuildKit runs every RUN step and, because no Dockerfile has a # syntax=
# line, also supplies the Dockerfile frontend. Keep this digest identical in
# every workflow that sets up Buildx (scripts/assert-buildkit-pinned.sh).
env:
  BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

jobs:
  # Shared static prefix, built once per architecture in this run.
  # Do not restore a cross-run cache here; release provenance stays hermetic.
  deps:
    name: Deps ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build deps prefix
        run: |
          make -C deps build ARCH=${{ matrix.arch }} OUT_DIR="${GITHUB_WORKSPACE}/dist"

      - name: Upload deps prefix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-prefix-${{ matrix.arch }}
          path: dist/deps/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.tool }}-${{ matrix.arch }}
    needs: [deps]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: [mtr, drill, dig, curl, wget, iperf3, tcpdump, ncat, openssl, rsync, socat, jq, fping, strace, ncdu, file, xxd, htop, iproute2, lsof, nmap, zstd, nethogs, whois, less, sysstat, tree, libcap]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Download deps prefix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deps-prefix-${{ matrix.arch }}
          path: dist/deps/${{ matrix.arch }}

      - name: Verify deps prefix
        run: |
          # upload-artifact/download-artifact do not preserve execute bits
          chmod +x \
            dist/deps/${{ matrix.arch }}/bin/openssl \
            dist/deps/${{ matrix.arch }}/bin/pkg-config
          test -f dist/deps/${{ matrix.arch }}/lib/libssl.a
          test -x dist/deps/${{ matrix.arch }}/bin/pkg-config
          test -x dist/deps/${{ matrix.arch }}/bin/openssl

      - name: Build ${{ matrix.tool }} for ${{ matrix.arch }}
        run: |
          make build-${{ matrix.tool }} ARCH=${{ matrix.arch }}

      # The Docker export copies all of /out/, which upstream build code can
      # write to. Stage only the files this tool ships, by name, so an extra
      # file (say, another tool's curl-amd64) is never uploaded.
      - name: Check and stage release files
        env:
          TOOL: ${{ matrix.tool }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          data=()
          case "${TOOL}" in
            mtr) bins=(mtr mtr-packet) ;;
            file) bins=(file); data=(magic.mgc) ;;
            iproute2) bins=(ip ss) ;;
            sysstat) bins=(mpstat iostat pidstat sar sadc) ;;
            libcap) bins=(getcap setcap) ;;
            nmap) bins=(nmap); data=(nmap-services) ;;
            *) bins=("${TOOL}") ;;
          esac
          out="dist/${TOOL}/${ARCH}"
          mkdir stage
          for name in "${bins[@]}" "${data[@]}"; do
            if [[ -L "${out}/${name}" || ! -f "${out}/${name}" ]]; then
              echo "::error::${out}/${name} is missing or not a regular file"
              exit 1
            fi
            cp "${out}/${name}" "stage/${name}-${ARCH}"
          done
          staged_bins=()
          for name in "${bins[@]}"; do
            staged_bins+=("stage/${name}-${ARCH}")
          done
          scripts/assert-static-elf.sh "${staged_bins[@]}"
          ls -la stage

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.tool }}-${{ matrix.arch }}
          path: stage/
          if-no-files-found: error
          retention-days: 5

  # Checksums, SBOMs, and the signing inputs are derived here (contents: read
  # only) so the attested SHA256SUMS.txt bytes are the ones published later.
  manifests:
    name: Release manifests
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sbom-matrix: ${{ steps.manifests.outputs.sbom-matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: false

      - name: Generate checksums, SBOMs, and signing inputs
        id: manifests
        run: |
          set -euo pipefail
          # Fails unless the built set is exactly `make print-artifacts`.
          mapfile -t bins < <(scripts/collect-release-bins.sh artifacts subjects)
          echo "Release binaries (${#bins[@]}):"
          printf '  %s\n' "${bins[@]}"
          (
            cd subjects
            sha256sum "${bins[@]}" > ../SHA256SUMS.txt
          )
          scripts/generate-sbom.sh --tag "${GITHUB_REF_NAME}" --out-dir sboms "${bins[@]}"
          # Every binary must have exactly one SBOM.
          diff -u \
            <(printf '%s\n' "${bins[@]}" | sort) \
            <(find sboms -maxdepth 1 -name '*.spdx.json' -printf '%f\n' | sed 's/\.spdx\.json$//' | sort)
          # Provenance subjects: every release binary plus SHA256SUMS.txt.
          { cat SHA256SUMS.txt; sha256sum SHA256SUMS.txt; } > provenance-subjects.txt
          # One SBOM attestation per binary, keyed by name and digest.
          matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0) | capture("^(?<digest>[0-9a-f]{64})  (?<name>[^/ ]+)$"))' SHA256SUMS.txt)
          if [[ "$(jq length <<< "${matrix}")" -ne "${#bins[@]}" ]]; then
            echo "::error::SBOM matrix does not list every binary in SHA256SUMS.txt"
            exit 1
          fi
          echo "sbom-matrix=${matrix}" >> "${GITHUB_OUTPUT}"

      - name: Upload release manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifests
          path: |
            SHA256SUMS.txt
            provenance-subjects.txt
            sboms/
          if-no-files-found: error
          retention-days: 5

  # Signing jobs: no checkout, no repository scripts, no build outputs. They
  # sign the digests the manifests job listed; SLSA lets build steps supply
  # output digests, and nothing the build produced runs next to the OIDC token.
  attest:
    name: Attest release binaries
    needs: [manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download release manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifests
          path: manifests

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: manifests/provenance-subjects.txt

  attest-sbom:
    name: Attest SBOM ${{ matrix.name }}
    needs: [manifests, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.manifests.outputs.sbom-matrix) }}
    steps:
      - name: Download release manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifests
          path: manifests

      - name: Generate SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.name }}
          subject-digest: sha256:${{ matrix.digest }}
          sbom-path: manifests/sboms/${{ matrix.name }}.spdx.json
