# Release workflow for static-tools
# Verifies the release tag, builds and signs in attest.yml, then publishes.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Retry a release by dispatching from its tag:
  #   gh workflow run release.yml --ref <tag>
  # There are no inputs. The tag ref is the only external parameter, and the
  # provenance records it (externalParameters.workflow.ref).
  workflow_dispatch:

permissions: {}

# Tag push and workflow_dispatch of the same tag must not publish over each other.
# cancel-in-progress is false so a started release is not aborted mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every job checks out github.sha: the commit the tag pointed at when the run
# started, which is the commit the provenance names.
jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history so the tag commit can be checked against main and its
          # signature verified.
          fetch-depth: 0

      - name: Verify the run is for a release tag
        id: verify
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::Releases run from a v* tag, not ${GITHUB_REF}. To retry one, dispatch from the tag: gh workflow run release.yml --ref <tag>"
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "${TAG_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${TAG} points at ${TAG_SHA} but this run is for ${GITHUB_SHA}"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Verified tag ${TAG} at ${GITHUB_SHA}"

      - name: Verify tag commit is reachable from main
        env:
          TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${TAG} points at ${GITHUB_SHA}, which is not reachable from origin/main. Releases must be cut from commits merged to main."
            exit 1
          fi
          echo "✓ ${GITHUB_SHA} is reachable from origin/main"

      - name: Verify tag commit signature
        env:
          KEY_OWNER: ${{ github.repository_owner }}
        run: scripts/verify-commit-signatures.sh "${GITHUB_SHA}^!"

      - name: Verify signed upstream tarball pins
        run: scripts/verify-upstream-signatures.sh

      # Published releases are immutable, so the publish step would fail
      # anyway. Stop before building, so a rerun cannot sign a second set of
      # binaries for a tag that already shipped.
      - name: Refuse to rebuild a published release
        env:
          TAG: ${{ steps.verify.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null)" == "false" ]]; then
            echo "::error::Release ${TAG} is already published and immutable. Cut a new tag instead."
            exit 1
          fi

  # Build and sign in the reusable workflow. Only its signing jobs use
  # id-token and attestations; everything else in it is contents: read.
  attest:
    needs: [verify-tag]
    uses: ./.github/workflows/attest.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

  release:
    name: Create GitHub Release
    needs: [verify-tag, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mapfile -t bins < <(scripts/collect-release-bins.sh artifacts release)
          binary_count=${#bins[@]}
          echo "Release binaries (${binary_count}):"
          printf '  %s\n' "${bins[@]}"
          cp artifacts/release-manifests/SHA256SUMS.txt release/SHA256SUMS.txt
          cd release
          # Publish the attested SHA256SUMS.txt bytes; do not regenerate.
          sha256sum -c SHA256SUMS.txt
          sum_count="$(wc -l < SHA256SUMS.txt)"
          if [ "${sum_count}" -ne "${binary_count}" ]; then
            echo "::error::SHA256SUMS.txt has ${sum_count} lines, expected ${binary_count}"
            exit 1
          fi
          ls -la

      - name: Create Draft GitHub Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          name: Release ${{ needs.verify-tag.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
          body: |
            ## Static Binaries

            This release includes statically compiled binaries with build provenance attestations.

            Artifacts are named `<tool>-<arch>` (for example `curl-amd64` and `curl-arm64`).

            ### Architectures
            - `amd64` (x86_64)
            - `arm64` (aarch64)

            ### Verification

            Verify build provenance using the [GitHub CLI](https://cli.github.com/):

            ```bash
            gh attestation verify curl-amd64 \
              --repo ${{ github.repository }} \
              --cert-identity https://github.com/${{ github.repository }}/.github/workflows/attest.yml@refs/tags/${{ needs.verify-tag.outputs.tag }} \
              --source-ref refs/tags/${{ needs.verify-tag.outputs.tag }} \
              --deny-self-hosted-runners
            ```

            Or use the wrapper script:

            ```bash
            ./scripts/verify.sh ${{ needs.verify-tag.outputs.tag }} curl-amd64 SHA256SUMS.txt
            ```

            `--cert-identity` pins both the signing workflow and the tag it ran
            from (including for `SHA256SUMS.txt`, which is also a provenance subject).
            `--signer-workflow` matches only the workflow path, so on its
            own it would accept an attestation produced from any ref.

            ### Checksums

            See `SHA256SUMS.txt` for file checksums. That file is attested;
            verify it with `gh attestation verify SHA256SUMS.txt` using the
            same flags as above.

            ### SBOM

            Each binary has a signed SPDX 2.3 SBOM attestation listing the
            pinned tool tarball and the prefix libraries linked into it:

            ```bash
            gh attestation verify curl-amd64 \
              --repo ${{ github.repository }} \
              --cert-identity https://github.com/${{ github.repository }}/.github/workflows/attest.yml@refs/tags/${{ needs.verify-tag.outputs.tag }} \
              --source-ref refs/tags/${{ needs.verify-tag.outputs.tag }} \
              --deny-self-hosted-runners \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --format json
            ```

            Or: `VERIFY_PREDICATE_TYPE=https://spdx.dev/Document/v2.3 ./scripts/verify.sh ${{ needs.verify-tag.outputs.tag }} curl-amd64`

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          draft: false

  verify-published:
    name: Verify published assets
    needs: [verify-tag, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download published release assets
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "${TAG}" --dir published
          echo "Published assets:"
          ls -la published

      - name: Verify published checksums and attestations
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          VERIFY_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fails unless the published set is exactly `make print-artifacts`.
          scripts/collect-release-bins.sh published "${RUNNER_TEMP}/published-bins" >/dev/null
          cd published
          test -f SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          mapfile -t bins < <(find . -maxdepth 1 -type f \( -name '*-amd64' -o -name '*-arm64' \) -printf '%f\n' | sort)
          ../scripts/verify.sh "${TAG}" "${bins[@]}" SHA256SUMS.txt
          VERIFY_PREDICATE_TYPE=https://spdx.dev/Document/v2.3 ../scripts/verify.sh "${TAG}" "${bins[@]}"
