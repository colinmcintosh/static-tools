# Release workflow for static-tools
# Verifies the release tag, builds and signs in attest.yml, verifies the
# assets, then publishes.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Retry a release by dispatching from its tag:
  #   gh workflow run release.yml --ref <tag>
  # There are no inputs. The tag ref is the only external parameter, and the
  # provenance records it (externalParameters.workflow.ref).
  workflow_dispatch:

permissions: {}

# Tag push and workflow_dispatch of the same tag must not publish over each other.
# cancel-in-progress is false so a started release is not aborted mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every job checks out github.sha: the commit the tag pointed at when the run
# started, which is the commit the provenance names.
jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history so the tag commit can be checked against main and its
          # signature verified.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the run is for a release tag
        id: verify
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::Releases run from a v* tag, not ${GITHUB_REF}. To retry one, dispatch from the tag: gh workflow run release.yml --ref <tag>"
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "${TAG_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${TAG} points at ${TAG_SHA} but this run is for ${GITHUB_SHA}"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Verified tag ${TAG} at ${GITHUB_SHA}"

      - name: Verify tag commit is reachable from main
        env:
          TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${TAG} points at ${GITHUB_SHA}, which is not reachable from origin/main. Releases must be cut from commits merged to main."
            exit 1
          fi
          echo "✓ ${GITHUB_SHA} is reachable from origin/main"

      - name: Verify tag commit signature
        env:
          KEY_OWNER: ${{ github.repository_owner }}
        run: scripts/verify-commit-signatures.sh "${GITHUB_SHA}^!"

      - name: Verify signed upstream tarball pins
        run: scripts/verify-upstream-signatures.sh

      - name: Verify the builder image
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-builder-image.sh

      # Published releases are immutable, so the publish step would fail
      # anyway. Stop before building, so a rerun cannot sign a second set of
      # binaries for a tag that already shipped.
      - name: Refuse to rebuild a published release
        env:
          TAG: ${{ steps.verify.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null)" == "false" ]]; then
            echo "::error::Release ${TAG} is already published and immutable. Cut a new tag instead."
            exit 1
          fi

  # Build and sign in the reusable workflow. Only its signing jobs use
  # id-token and attestations; everything else in it is contents: read.
  attest:
    needs: [verify-tag]
    uses: ./.github/workflows/attest.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  # Published releases are immutable, so every check runs before publishing:
  # the assets are verified against their attestations, uploaded to a draft,
  # and the draft's asset digests are compared with the verified files.
  release:
    name: Create GitHub Release
    needs: [verify-tag, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mapfile -t bins < <(scripts/collect-release-bins.sh artifacts release)
          binary_count=${#bins[@]}
          echo "Release binaries (${binary_count}):"
          printf '  %s\n' "${bins[@]}"
          cp artifacts/release-manifests/SHA256SUMS.txt release/SHA256SUMS.txt
          cd release
          # Publish the attested SHA256SUMS.txt bytes; do not regenerate.
          sha256sum -c SHA256SUMS.txt
          sum_count="$(wc -l < SHA256SUMS.txt)"
          if [ "${sum_count}" -ne "${binary_count}" ]; then
            echo "::error::SHA256SUMS.txt has ${sum_count} lines, expected ${binary_count}"
            exit 1
          fi
          ls -la

      - name: Verify every asset's attestations
        working-directory: release
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          VERIFY_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t bins < <(printf '%s\n' "${files[@]}" | grep -vx SHA256SUMS.txt)
          ../scripts/verify.sh "${TAG}" "${files[@]}"
          VERIFY_PREDICATE_TYPE=https://spdx.dev/Document/v2.3 ../scripts/verify.sh "${TAG}" "${bins[@]}"

      - name: Upload assets to a draft release
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Quoted heredoc, so the shell expands nothing in it; the two
          # placeholders are replaced below.
          notes=$(cat <<'EOF'
          ## Static Binaries

          Statically linked binaries for `amd64` (x86_64) and `arm64` (aarch64),
          named `<tool>-<arch>` (for example `curl-amd64`).

          ### Verification

          Verify build provenance with the [GitHub CLI](https://cli.github.com/):

          ```bash
          gh attestation verify curl-amd64 \
            --repo @REPO@ \
            --cert-identity https://github.com/@REPO@/.github/workflows/attest.yml@refs/tags/@TAG@ \
            --source-ref refs/tags/@TAG@ \
            --deny-self-hosted-runners
          ```

          The same command verifies `SHA256SUMS.txt`. Add
          `--predicate-type https://spdx.dev/Document/v2.3` to verify a
          binary's SBOM. `scripts/verify.sh` runs these checks and also
          requires the release commit to be on `main`. The
          [README](https://github.com/@REPO@#verify-provenance-recommended)
          covers checksums, SBOMs, and the wrapper.
          EOF
          )
          notes=${notes//@REPO@/"${GH_REPO}"}
          notes=${notes//@TAG@/"${TAG}"}
          printf '%s\n' "${notes}" > "${RUNNER_TEMP}/notes.md"
          # A rerun after a failed publish finds its own draft (verify-tag
          # stops a rerun once the release is published). Remove any asset
          # this run does not upload, then replace the rest.
          if [[ "$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null)" == "true" ]]; then
            gh release view "${TAG}" --json assets --jq '.assets[].name' |
              while IFS= read -r name; do
                if [[ ! -f "release/${name}" ]]; then
                  gh release delete-asset "${TAG}" "${name}" --yes
                fi
              done
            gh release upload "${TAG}" release/* --clobber
          else
            gh release create "${TAG}" release/* \
              --draft \
              --verify-tag \
              --title "Release ${TAG}" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --generate-notes
          fi

      - name: Check the draft's assets
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The API allows a null asset digest, so give GitHub a minute to
          # record every digest before comparing.
          for attempt in 1 2 3 4 5 6; do
            draft=$(gh release view "${TAG}" --json isDraft,assets \
              --jq 'select(.isDraft) | .assets[] | "\(.digest)  \(.name)"' | sort)
            if ! grep -q '^null ' <<< "${draft}"; then
              break
            fi
            echo "Waiting for asset digests (attempt ${attempt})"
            sleep 10
          done
          # The draft must hold exactly the verified files, byte for byte.
          if ! diff -u \
              <(cd release && sha256sum -- * | sed 's/^/sha256:/' | sort) \
              <(printf '%s\n' "${draft}"); then
            echo "::error::The draft release's assets differ from the verified files"
            exit 1
          fi
          echo "✓ The draft holds exactly the verified files"

      - name: Publish the release
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${TAG}" --draft=false
