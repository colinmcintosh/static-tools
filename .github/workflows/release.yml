# Release workflow for static-tools
# Builds statically compiled binaries; provenance is signed in attest.yml

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions: {}

# Tag push and workflow_dispatch of the same tag must not publish over each other.
# cancel-in-progress is false so a started release is not aborted mid-publish.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && replace(inputs.tag, 'refs/tags/', '') || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Checkout refs/tags/<tag>
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # Full history so the tag commit can be checked against main and its
          # signature verified.
          fetch-depth: 0

      - name: Verify tag points at the commit being built
        id: verify
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG#refs/tags/}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "${TAG}" ]]; then
            echo "::error::Release tag is empty"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            echo "::error::Tag ${TAG} is missing"
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "${TAG_SHA}" != "${HEAD_SHA}" ]]; then
            echo "::error::Tag ${TAG} points at ${TAG_SHA} but HEAD is ${HEAD_SHA}"
            exit 1
          fi
          if [[ "${TAG_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${TAG} points at ${TAG_SHA} but this workflow run is ${GITHUB_SHA}. Dispatch from the tag so provenance matches the commit being built."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "sha=${TAG_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Verified tag ${TAG} at ${TAG_SHA}"

      - name: Verify tag commit is reachable from main
        env:
          TAG: ${{ steps.verify.outputs.tag }}
          TAG_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/main; then
            echo "::error::Tag ${TAG} points at ${TAG_SHA}, which is not reachable from origin/main. Releases must be cut from commits merged to main."
            exit 1
          fi
          echo "✓ ${TAG_SHA} is reachable from origin/main"

      - name: Verify tag commit signature
        env:
          TAG_SHA: ${{ steps.verify.outputs.sha }}
          KEY_OWNER: ${{ github.repository_owner }}
        run: scripts/verify-commit-signatures.sh "${TAG_SHA}^!"

      - name: Refuse to overwrite a published release
        env:
          TAG: ${{ steps.verify.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if json=$(gh release view "${TAG}" --json isDraft 2>/dev/null); then
            is_draft=$(printf '%s' "${json}" | jq -r .isDraft)
            if [[ "${is_draft}" == "false" ]]; then
              echo "::error::Release ${TAG} is already published. Re-running would replace assets with different bytes while existing checksums and attestations stay in circulation. Delete the GitHub Release (not the tag) first if a republish is intentional."
              exit 1
            fi
            echo "Draft release ${TAG} exists; this run may update it"
          else
            echo "No existing release for ${TAG}"
          fi

  # Shared static prefix, built once per architecture in this run.
  # Do not restore a cross-run cache here; release provenance stays hermetic.
  deps:
    name: Deps ${{ matrix.arch }}
    needs: [verify-tag]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ format('refs/tags/{0}', needs.verify-tag.outputs.tag) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build deps prefix
        run: |
          make -C deps build ARCH=${{ matrix.arch }} OUT_DIR="${GITHUB_WORKSPACE}/dist"

      - name: Upload deps prefix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deps-prefix-${{ matrix.arch }}
          path: dist/deps/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.tool }}-${{ matrix.arch }}
    needs: [verify-tag, deps]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: [mtr, drill, dig, curl, wget, iperf3, tcpdump, ncat, openssl, rsync, socat, jq, fping, strace, ncdu, file, xxd, htop]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ format('refs/tags/{0}', needs.verify-tag.outputs.tag) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Download deps prefix
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deps-prefix-${{ matrix.arch }}
          path: dist/deps/${{ matrix.arch }}

      - name: Verify deps prefix
        run: |
          # upload-artifact/download-artifact do not preserve execute bits
          chmod +x dist/deps/${{ matrix.arch }}/bin/*
          test -f dist/deps/${{ matrix.arch }}/lib/libssl.a
          test -x dist/deps/${{ matrix.arch }}/bin/pkg-config
          test -x dist/deps/${{ matrix.arch }}/bin/openssl

      - name: Build ${{ matrix.tool }} for ${{ matrix.arch }}
        run: |
          make build-${{ matrix.tool }} ARCH=${{ matrix.arch }}

      - name: Verify binary is a static PIE
        env:
          TOOL: ${{ matrix.tool }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          scripts/assert-static-elf.sh "dist/${TOOL}/${ARCH}/${TOOL}"
          if [ "${TOOL}" = "mtr" ]; then
            scripts/assert-static-elf.sh "dist/mtr/${ARCH}/mtr-packet"
          fi

      - name: Rename artifacts with architecture suffix
        run: |
          cd dist/${{ matrix.tool }}/${{ matrix.arch }}
          if [ "${{ matrix.tool }}" = "mtr" ]; then
            for file in mtr mtr-packet; do
              mv "$file" "$file-${{ matrix.arch }}"
            done
          elif [ "${{ matrix.tool }}" = "file" ]; then
            mv file "file-${{ matrix.arch }}"
            mv magic.mgc "magic.mgc-${{ matrix.arch }}"
          else
            mv ${{ matrix.tool }} ${{ matrix.tool }}-${{ matrix.arch }}
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.tool }}-${{ matrix.arch }}
          path: dist/${{ matrix.tool }}/${{ matrix.arch }}/*-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 5

  attest:
    needs: [build]
    uses: ./.github/workflows/attest.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

  release:
    name: Create GitHub Release
    needs: [verify-tag, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ format('refs/tags/{0}', needs.verify-tag.outputs.tag) }}

      - name: Refuse to overwrite a published release
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if json=$(gh release view "${TAG}" --json isDraft 2>/dev/null); then
            is_draft=$(printf '%s' "${json}" | jq -r .isDraft)
            if [[ "${is_draft}" == "false" ]]; then
              echo "::error::Release ${TAG} is already published. Re-running would replace assets with different bytes while existing checksums and attestations stay in circulation. Delete the GitHub Release (not the tag) first if a republish is intentional."
              exit 1
            fi
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*-amd64' -o -name '*-arm64' \) ! -path 'artifacts/deps-prefix-*/*' -exec cp {} release/ \;
          cd release
          mapfile -t bins < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          binary_count=${#bins[@]}
          # 2 architectures × (18 tools + mtr-packet + magic.mgc)
          expected=40
          echo "Release binaries (${binary_count}):"
          printf '  %s\n' "${bins[@]}"
          if [ "${binary_count}" -ne "${expected}" ]; then
            echo "::error::Expected ${expected} binaries, found ${binary_count}"
            exit 1
          fi
          sha256sum "${bins[@]}" > SHA256SUMS.txt
          sum_count="$(wc -l < SHA256SUMS.txt)"
          if [ "${sum_count}" -ne "${binary_count}" ]; then
            echo "::error::SHA256SUMS.txt has ${sum_count} lines, expected ${binary_count}"
            exit 1
          fi
          ls -la

      - name: Create Draft GitHub Release
        id: create_release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          name: Release ${{ needs.verify-tag.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
          body: |
            ## Static Binaries

            This release includes statically compiled binaries with build provenance attestations.

            Artifacts are named `<tool>-<arch>` (for example `curl-amd64` and `curl-arm64`).

            ### Architectures
            - `amd64` (x86_64)
            - `arm64` (aarch64)

            ### Verification

            Verify build provenance using the [GitHub CLI](https://cli.github.com/):

            ```bash
            gh attestation verify curl-amd64 \
              --repo ${{ github.repository }} \
              --cert-identity https://github.com/${{ github.repository }}/.github/workflows/attest.yml@refs/tags/${{ needs.verify-tag.outputs.tag }} \
              --source-ref refs/tags/${{ needs.verify-tag.outputs.tag }} \
              --deny-self-hosted-runners
            ```

            Or use the wrapper script:

            ```bash
            ./scripts/verify.sh ${{ needs.verify-tag.outputs.tag }} curl-amd64
            ```

            `--cert-identity` pins both the signing workflow and the tag it ran
            from. `--signer-workflow` matches only the workflow path, so on its
            own it would accept an attestation produced from any ref.

            ### Checksums

            See `SHA256SUMS.txt` for file checksums.

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          draft: false

  verify-published:
    name: Verify published assets
    needs: [verify-tag, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ format('refs/tags/{0}', needs.verify-tag.outputs.tag) }}

      - name: Download published release assets
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "${TAG}" --dir published
          echo "Published assets:"
          ls -la published

      - name: Verify published checksums and attestations
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          VERIFY_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd published
          test -f SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          mapfile -t bins < <(find . -maxdepth 1 -type f \( -name '*-amd64' -o -name '*-arm64' \) -printf '%f\n' | sort)
          expected=40
          if [ "${#bins[@]}" -ne "${expected}" ]; then
            echo "::error::Expected ${expected} published binaries, found ${#bins[@]}"
            exit 1
          fi
          # SHA256SUMS.txt is not attested; verify binaries only.
          ../scripts/verify.sh "${TAG}" "${bins[@]}"
