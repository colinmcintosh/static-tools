# CI workflow for static-tools
# Runs on every push and pull request to validate builds

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Verify commits in the push/PR range are signed
  verify-signatures:
    name: Verify commit signatures
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit signatures in range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          KEY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse --verify --quiet origin/main; then
              RANGE="origin/main..${SHA}"
            else
              RANGE="${SHA}^!"
            fi
          else
            RANGE="${BEFORE}..${SHA}"
          fi

          scripts/verify-commit-signatures.sh "${RANGE}"

  changes:
    name: Detect changed tools
    runs-on: ubuntu-24.04
    outputs:
      tools: ${{ steps.detect.outputs.tools }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect tools to build
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FORCE_ALL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:build-all') }}
        run: |
          set -euo pipefail
          if [ "${FORCE_ALL}" = "true" ]; then
            echo "PR labeled ci:build-all; building all tools"
            TOOLS="$(scripts/ci-changed-tools.sh --all)"
            echo "tools=${TOOLS}" >> "${GITHUB_OUTPUT}"
            echo "any=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            BASE="${PR_BASE}"
          else
            BASE="${BEFORE}"
          fi
          if [ -n "${BASE}" ] && ! [[ "${BASE}" =~ ^0+$ ]] && ! git cat-file -e "${BASE}^{commit}"; then
            git fetch --no-tags origin "${BASE}"
          fi
          TOOLS="$(scripts/ci-changed-tools.sh "${BASE}" "${SHA}")"
          echo "tools=${TOOLS}" >> "${GITHUB_OUTPUT}"
          if [ "${TOOLS}" = "[]" ]; then
            echo "any=false" >> "${GITHUB_OUTPUT}"
          else
            echo "any=true" >> "${GITHUB_OUTPUT}"
          fi

  deps:
    name: Deps ${{ matrix.arch }}
    needs: [verify-signatures, changes]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Restore deps prefix cache
        id: cache-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/deps/${{ matrix.arch }}
          key: deps-${{ matrix.arch }}-${{ hashFiles('deps/Dockerfile', 'deps/versions.mk', 'deps/Makefile') }}

      - name: Build deps prefix
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          make -C deps build ARCH=${{ matrix.arch }} OUT_DIR="${GITHUB_WORKSPACE}/dist"

      - name: Upload deps prefix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-prefix-${{ matrix.arch }}
          path: dist/deps/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.tool }}-${{ matrix.arch }}
    needs: [verify-signatures, changes, deps]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.tools) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Download deps prefix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deps-prefix-${{ matrix.arch }}
          path: dist/deps/${{ matrix.arch }}

      - name: Verify deps prefix
        run: |
          # upload-artifact/download-artifact do not preserve execute bits
          chmod +x \
            dist/deps/${{ matrix.arch }}/bin/openssl \
            dist/deps/${{ matrix.arch }}/bin/pkg-config
          test -f dist/deps/${{ matrix.arch }}/lib/libssl.a
          test -x dist/deps/${{ matrix.arch }}/bin/pkg-config
          test -x dist/deps/${{ matrix.arch }}/bin/openssl

      - name: Build ${{ matrix.tool }} for ${{ matrix.arch }}
        run: |
          make build-${{ matrix.tool }} ARCH=${{ matrix.arch }}

      - name: Test ${{ matrix.tool }}
        run: |
          make test-${{ matrix.tool }} ARCH=${{ matrix.arch }}

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.tool }}-${{ matrix.arch }}-${{ github.sha }}
          path: dist/${{ matrix.tool }}/${{ matrix.arch }}/
          retention-days: 7

  # Dockerfiles (hadolint), scripts/*.sh (shellcheck), workflows (actionlint).
  # make lint installs the pinned linters; versions and checksums live in the Makefile.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfiles, scripts, and workflows
        run: make lint

      - name: Test source URL wiring
        run: scripts/assert-source-url-wired-test.sh

      - name: Test change detection
        run: scripts/ci-changed-tools-test.sh

      - name: Test commit signature gate
        run: scripts/verify-commit-signatures-test.sh

      - name: Test SBOM generator
        run: scripts/generate-sbom-test.sh

      - name: Test release artifact collection
        run: scripts/collect-release-bins-test.sh

  # Stable required check. Matrix job names expand (Build curl-amd64, …),
  # so a ruleset cannot require the unexpanded template name.
  ci:
    name: CI
    if: ${{ always() && !cancelled() }}
    needs: [verify-signatures, changes, deps, build, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: Check required jobs succeeded
        if: >-
          ${{
            needs.verify-signatures.result != 'success'
            || needs.changes.result != 'success'
            || needs.lint.result != 'success'
            || (needs.changes.outputs.any == 'true' && needs.deps.result != 'success')
            || (needs.changes.outputs.any == 'true' && needs.build.result != 'success')
            || needs.deps.result == 'failure'
            || needs.deps.result == 'cancelled'
            || needs.build.result == 'failure'
            || needs.build.result == 'cancelled'
          }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
