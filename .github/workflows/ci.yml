# CI workflow for static-tools
# Runs on every push and pull request to validate builds

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Verify all commits are signed
  verify-signatures:
    name: Verify commit signatures
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check all commits are signed
        run: |
          echo "Checking commit signatures..."
          UNSIGNED_COMMITS=$(git log --format="%H %G? %s" | grep " N " || true)
          if [ -n "$UNSIGNED_COMMITS" ]; then
            echo "::error::Found unsigned commits:"
            echo "$UNSIGNED_COMMITS"
            exit 1
          fi
          echo "✓ All commits are signed"

  changes:
    name: Detect changed tools
    runs-on: ubuntu-24.04
    outputs:
      tools: ${{ steps.detect.outputs.tools }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect tools to build
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            BASE="${PR_BASE}"
          else
            BASE="${BEFORE}"
          fi
          if [ -n "${BASE}" ] && ! [[ "${BASE}" =~ ^0+$ ]] && ! git cat-file -e "${BASE}^{commit}"; then
            git fetch --no-tags origin "${BASE}"
          fi
          TOOLS="$(scripts/ci-changed-tools.sh "${BASE}" "${SHA}")"
          echo "tools=${TOOLS}" >> "${GITHUB_OUTPUT}"
          if [ "${TOOLS}" = "[]" ]; then
            echo "any=false" >> "${GITHUB_OUTPUT}"
          else
            echo "any=true" >> "${GITHUB_OUTPUT}"
          fi

  deps:
    name: Deps ${{ matrix.arch }}
    needs: [verify-signatures, changes]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Restore deps prefix cache
        id: cache-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/deps/${{ matrix.arch }}
          key: deps-${{ matrix.arch }}-${{ hashFiles('deps/Dockerfile', 'deps/versions.mk', 'deps/Makefile') }}

      - name: Build deps prefix
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          make -C deps build ARCH=${{ matrix.arch }} OUT_DIR="${GITHUB_WORKSPACE}/dist"

      - name: Upload deps prefix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deps-prefix-${{ matrix.arch }}
          path: dist/deps/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.tool }}-${{ matrix.arch }}
    needs: [verify-signatures, changes, deps]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.tools) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Download deps prefix
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deps-prefix-${{ matrix.arch }}
          path: dist/deps/${{ matrix.arch }}

      - name: Verify deps prefix
        run: |
          test -f dist/deps/${{ matrix.arch }}/lib/libssl.a

      - name: Build ${{ matrix.tool }} for ${{ matrix.arch }}
        run: |
          make build-${{ matrix.tool }} ARCH=${{ matrix.arch }}

      - name: Test ${{ matrix.tool }}
        run: |
          make test-${{ matrix.tool }} ARCH=${{ matrix.arch }}

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.tool }}-${{ matrix.arch }}-${{ github.sha }}
          path: dist/${{ matrix.tool }}/${{ matrix.arch }}/
          retention-days: 7

  # Validate Dockerfile best practices
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install hadolint
        run: |
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: make lint

  # Stable required check. Matrix job names expand (Build curl-amd64, …),
  # so a ruleset cannot require the unexpanded template name.
  ci:
    name: CI
    if: ${{ always() && !cancelled() }}
    needs: [verify-signatures, changes, deps, build, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: Check required jobs succeeded
        if: >-
          ${{
            needs.verify-signatures.result != 'success'
            || needs.changes.result != 'success'
            || needs.lint.result != 'success'
            || (needs.changes.outputs.any == 'true' && needs.deps.result != 'success')
            || (needs.changes.outputs.any == 'true' && needs.build.result != 'success')
            || needs.deps.result == 'failure'
            || needs.deps.result == 'cancelled'
            || needs.build.result == 'failure'
            || needs.build.result == 'cancelled'
          }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
